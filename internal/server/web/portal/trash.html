<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your trash</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wide">
    <header class="bar">
      <h1>Your trash</h1>
      <nav class="actions">
        <a class="link" href="/">Files</a>
        <a class="link" href="/photos">Photos</a>
        <a class="link" id="tv-link" href="/tv" hidden>TV</a>
        <a class="link" href="/trash" aria-current="page">Trash</a>
        <a class="link" href="/password">Password</a>
        <button class="link" id="logout" type="button">Sign out</button>
      </nav>
    </header>
    <p class="error" id="status" role="status"></p>
    <p class="notice" id="notice" role="status" hidden></p>
    <section class="card">
      <p class="detail" id="summary"></p>
      <table id="files">
        <tbody id="file-rows"></tbody>
      </table>
      <p class="detail" id="empty" hidden>The trash is empty.</p>
      <div class="toolbar">
        <button type="button" id="empty-trash" class="danger-solid" hidden>Empty trash</button>
        <span id="empty-confirm" class="toolbar"></span>
      </div>
    </section>
  </main>
  <script src="/static/nav.js"></script>
  <script src="/static/trash.js"></script>
  <script src="/static/tvlink.js"></script>
</body>
</html>
