<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your files</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wide">
    <header class="bar">
      <h1>Your files</h1>
      <nav class="actions">
        <a class="link" href="/" aria-current="page">Files</a>
        <a class="link" href="/photos">Photos</a>
        <a class="link" href="/trash">Trash</a>
        <a class="link" href="/password">Password</a>
        <button class="link" id="logout" type="button">Sign out</button>
      </nav>
    </header>
    <p class="error" id="status" role="status"></p>
    <section class="card">
      <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
      <table id="files">
        <tbody id="file-rows"></tbody>
      </table>
      <p class="detail" id="empty" hidden>This folder is empty.</p>
    </section>
    <section class="card stacked">
      <div class="label">Upload to this folder</div>
      <div class="toolbar">
        <label class="picker">Choose files <input type="file" id="upload-input" multiple></label>
        <label class="picker">Choose folder <input type="file" id="upload-folder" webkitdirectory></label>
      </div>
      <div class="dropzone" id="drop-zone">Or drop files and folders here</div>
      <div class="preview" id="preview" hidden>
        <div class="label" id="preview-title" role="status"></div>
        <div class="toolbar">
          <button type="button" id="preview-upload">Upload</button>
          <button type="button" id="preview-cancel" class="link">Cancel</button>
        </div>
        <ul id="preview-list"></ul>
      </div>
      <div class="conflicts" id="conflicts" hidden>
        <div class="label" id="conflict-title" role="status"></div>
        <div class="toolbar">
          <button type="button" id="conflict-skip-all" class="link">Skip all</button>
          <button type="button" id="conflict-replace-all" class="link">Replace all</button>
          <button type="button" id="conflict-continue">Continue upload</button>
        </div>
        <ul id="conflict-list"></ul>
      </div>
      <progress id="upload-total" max="100" value="0" hidden aria-label="Overall progress"></progress>
      <progress id="upload-progress" max="100" value="0" hidden aria-label="Progress of the current file"></progress>
      <p class="detail" id="upload-detail" role="status"></p>
      <p id="upload-summary" role="status"></p>
      <ul class="failures" id="upload-failures"></ul>
    </section>
    <form class="card stacked" id="folder-form" autocomplete="off">
      <div class="label">New folder in this folder</div>
      <div class="toolbar">
        <input type="text" id="folder-name" required maxlength="255" aria-label="Folder name" autocapitalize="none" spellcheck="false">
        <button type="submit">Create folder</button>
      </div>
      <p class="error" id="folder-error" role="alert"></p>
    </form>
  </main>
  <script src="/static/nav.js"></script>
  <script src="/static/viewer.js"></script>
  <script src="/static/files.js"></script>
</body>
</html>
