<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title data-i18n="login.title">Sign in to your files</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js"></script>
</head>
<body>
  <main>
    <form class="card auth" id="login-form">
      <h1 data-i18n="login.title">Sign in to your files</h1>
      <label for="username" data-i18n="login.username">Username or email address</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password" data-i18n="common.password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p class="error" id="error" role="alert"></p>
      <button type="submit" data-i18n="login.submit">Sign in</button>
      <a class="link" id="link-option" href="/sign-in-link" data-i18n="login.emailLink" hidden>Email me a sign-in link</a>
      <a class="link" href="/forgot" data-i18n="login.forgot">Forgot your password?</a>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
