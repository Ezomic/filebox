<!doctype html>
<html lang="en" data-scope="family">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title data-i18n="family.trashTitle">Family trash</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js"></script>
</head>
<body>
  <main class="wide">
    <header class="bar">
      <h1 data-i18n="family.trashTitle">Family trash</h1>
      <nav class="actions">
        <a class="link" href="/" data-i18n="nav.files">Files</a>
        <a class="link" href="/family" aria-current="page" data-i18n="nav.family">Family</a>
        <a class="link" href="/photos" data-i18n="nav.photos">Photos</a>
        <a class="link" href="/backup" data-i18n="nav.backup">Back up</a>
        <a class="link" id="tv-link" href="/tv" data-i18n="nav.tv" hidden>TV</a>
        <a class="link" href="/trash" data-i18n="nav.trash">Trash</a>
        <a class="link" href="/password" data-i18n="nav.password">Password</a>
        <button class="link" id="logout" type="button" data-i18n="nav.signout">Sign out</button>
      </nav>
    </header>
    <p class="error" id="status" role="status"></p>
    <p class="notice" id="notice" role="status" hidden></p>
    <p class="detail" data-i18n="family.trashIntro">Deleted family files stay here for 30 days. Anyone can restore them.</p>
    <p><a class="link" href="/family" data-i18n="family.back">Back to the family folder</a></p>
    <section class="card">
      <p class="detail" id="summary"></p>
      <table id="files">
        <tbody id="file-rows"></tbody>
      </table>
      <p class="detail" id="empty" data-i18n="trash.empty" hidden>The trash is empty.</p>
      <div class="toolbar">
        <button type="button" id="empty-trash" class="danger-solid" data-i18n="trash.emptyAll" hidden>Empty trash</button>
        <span id="empty-confirm" class="toolbar"></span>
      </div>
    </section>
  </main>
  <script src="/static/nav.js"></script>
  <script src="/static/storage.js"></script>
  <script src="/static/trash.js"></script>
  <script src="/static/tvlink.js"></script>
</body>
</html>
