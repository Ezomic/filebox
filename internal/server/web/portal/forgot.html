<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title data-i18n="forgot.title">Forgot your password</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js"></script>
</head>
<body>
  <main>
    <form class="card auth" id="forgot-form">
      <h1 data-i18n="forgot.title">Forgot your password</h1>
      <p class="detail" id="intro" data-i18n="forgot.intro">Enter your username and we will email a link to the address you confirmed on your account. The link works once and expires after 30 minutes.</p>
      <p class="detail" data-i18n="forgot.noAddress">No confirmed address? Ask the owner to reset your password.</p>
      <label for="username" data-i18n="common.username">Username</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <p class="error" id="error" role="alert"></p>
      <p class="detail" id="done" role="status" hidden></p>
      <button type="submit" data-i18n="common.emailLink">Email me a link</button>
      <a class="link" href="/login" data-i18n="common.backToSignIn">Back to sign in</a>
    </form>
  </main>
  <script src="/static/forgot.js"></script>
</body>
</html>
