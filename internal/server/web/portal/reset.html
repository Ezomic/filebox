<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title data-i18n="reset.title">Choose a new password</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js"></script>
</head>
<body>
  <main>
    <form class="card auth" id="reset-form">
      <h1 data-i18n="reset.title">Choose a new password</h1>
      <p class="detail" data-i18n="password.intro">This is also your SFTP password. You will be signed out everywhere afterwards.</p>
      <label for="password" data-i18n="password.new">New password (at least 12 characters)</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required autofocus>
      <label for="confirm" data-i18n="password.again">New password again</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <p class="error" id="error" role="alert"></p>
      <button type="submit" data-i18n="reset.submit">Set new password</button>
      <a class="link" href="/forgot" data-i18n="common.newLink">Ask for a new link</a>
    </form>
  </main>
  <script src="/static/reset.js"></script>
</body>
</html>
