<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change your password</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <form class="card auth" id="password-form">
      <h1>Change your password</h1>
      <p class="detail">This is also your SFTP password. You will be signed out everywhere afterwards.</p>
      <label for="current">Current password</label>
      <input id="current" type="password" autocomplete="current-password" required autofocus>
      <label for="password">New password (at least 12 characters)</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <label for="confirm">New password again</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <p class="error" id="error" role="alert"></p>
      <button type="submit">Change password</button>
      <a class="link" href="/">Back to your files</a>
    </form>
  </main>
  <script src="/static/password.js"></script>
</body>
</html>
