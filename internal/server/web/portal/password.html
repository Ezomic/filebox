<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title data-i18n="password.title">Change your password</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js"></script>
</head>
<body>
  <main>
    <form class="card auth" id="password-form">
      <h1 data-i18n="password.title">Change your password</h1>
      <p class="detail" data-i18n="password.intro">This is also your SFTP password. You will be signed out everywhere afterwards.</p>
      <label for="current" data-i18n="password.current">Current password</label>
      <input id="current" type="password" autocomplete="current-password" required autofocus>
      <label for="password" data-i18n="password.new">New password (at least 12 characters)</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <label for="confirm" data-i18n="password.again">New password again</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <p class="error" id="error" role="alert"></p>
      <button type="submit" data-i18n="password.submit">Change password</button>
      <a class="link" href="/" data-i18n="common.backToFiles">Back to your files</a>
    </form>
    <form class="card auth" id="email-form" hidden>
      <h1 data-i18n="email.title">Email address</h1>
      <p class="detail" id="email-state"></p>
      <p class="detail" data-i18n="email.intro">If you forget your password, we email a reset link to this address. We email a link to confirm it first.</p>
      <label for="email" data-i18n="email.title">Email address</label>
      <input id="email" type="text" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
      <label for="email-current" data-i18n="password.current">Current password</label>
      <input id="email-current" type="password" autocomplete="current-password" required>
      <p class="error" id="email-error" role="alert"></p>
      <p class="detail" id="email-done" role="status" hidden></p>
      <button type="submit" data-i18n="email.submit">Save address</button>
    </form>
  </main>
  <script src="/static/password.js"></script>
</body>
</html>
