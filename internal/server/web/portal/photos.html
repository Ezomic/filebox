<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your photos</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wide">
    <header class="bar">
      <h1>Your photos</h1>
      <nav class="actions">
        <a class="link" href="/">Files</a>
        <a class="link" href="/photos" aria-current="page">Photos</a>
        <a class="link" href="/trash">Trash</a>
        <a class="link" href="/password">Password</a>
        <button class="link" id="logout" type="button">Sign out</button>
      </nav>
    </header>
    <p class="error" id="status" role="status"></p>
    <section class="card">
      <div class="filters">
        <div class="type-filter" id="type-filter" role="group" aria-label="Show">
          <button class="link" type="button" data-type="" aria-pressed="true">All</button>
          <button class="link" type="button" data-type="image" aria-pressed="false">Photos</button>
          <button class="link" type="button" data-type="video" aria-pressed="false">Videos</button>
        </div>
        <form class="jump" id="jump">
          <label for="jump-year">Jump to</label>
          <input id="jump-year" type="number" inputmode="numeric" min="1900" max="9999" placeholder="Year" required>
          <select id="jump-month" aria-label="Month">
            <option value="">Whole year</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
          <button id="jump-go" type="submit">Go</button>
        </form>
        <p class="detail" id="jump-note" role="status"></p>
      </div>
      <p class="detail" id="summary"></p>
      <div id="photo-groups"></div>
      <p class="detail" id="empty" hidden>No photos or videos here yet.</p>
      <div id="sentinel" class="sentinel"></div>
    </section>
  </main>
  <script src="/static/nav.js"></script>
  <script src="/static/viewer.js"></script>
  <script src="/static/photos.js"></script>
</body>
</html>
