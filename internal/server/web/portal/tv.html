<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title data-i18n="nav.tv">TV</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js"></script>
</head>
<body>
  <main>
    <header class="bar">
      <h1 data-i18n="nav.tv">TV</h1>
      <nav class="actions">
        <a class="link" href="/" data-i18n="nav.files">Files</a>
        <a class="link" href="/photos" data-i18n="nav.photos">Photos</a>
        <a class="link" href="/backup" data-i18n="nav.backup">Back up</a>
        <a class="link" href="/tv" aria-current="page" data-i18n="nav.tv">TV</a>
        <a class="link" href="/trash" data-i18n="nav.trash">Trash</a>
        <a class="link" href="/password" data-i18n="nav.password">Password</a>
        <button class="link" id="logout" type="button" data-i18n="nav.signout">Sign out</button>
      </nav>
    </header>
    <p class="error" id="status" role="status"></p>
    <section class="card stacked">
      <div class="label" data-i18n="tv.playlist">Playlist link</div>
      <p class="detail" data-i18n="tv.help">Add this link as an M3U playlist in an IPTV app such as VLC, Kodi or TiviMate. The program guide is included automatically.</p>
      <div class="toolbar">
        <input type="text" id="playlist" readonly aria-label="Playlist link" data-i18n-attr="aria-label:tv.playlist" spellcheck="false">
        <button type="button" id="copy" data-i18n="tv.copy">Copy</button>
      </div>
      <p class="detail" data-i18n="tv.warning">Anyone with this link can watch, so do not share it outside the family.</p>
    </section>
  </main>
  <script src="/static/nav.js"></script>
  <script src="/static/tv.js"></script>
</body>
</html>
