<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filebox photos</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wide">
    <header class="bar">
      <h1>Photos</h1>
      <nav class="actions">
        <a class="link" href="/">Dashboard</a>
        <a class="link" href="/users">Users</a>
        <a class="link" href="/files">Files</a>
        <a class="link" href="/photos" aria-current="page">Photos</a>
        <a class="link" href="/trash">Trash</a>
        <a class="link" href="/logs">Logs</a>
        <button class="link" id="logout" type="button">Sign out</button>
      </nav>
    </header>
    <p class="error" id="status" role="status"></p>
    <section class="card">
      <div class="toolbar">
        <label for="photos-user">Show</label>
        <select id="photos-user">
          <option value="">Everything in the Files page</option>
        </select>
      </div>
      <p class="detail" id="summary"></p>
      <div id="photo-groups"></div>
      <p class="detail" id="empty" hidden>No photos or videos here yet.</p>
      <div id="sentinel" class="sentinel"></div>
    </section>
  </main>
  <script src="/static/viewer.js"></script>
  <script src="/static/photos.js"></script>
</body>
</html>
