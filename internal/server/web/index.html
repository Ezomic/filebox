<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filebox</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header class="bar">
      <h1>Filebox</h1>
      <nav class="actions">
        <a class="link" href="/users">Users</a>
        <a class="link" href="/files">Files</a>
        <a class="link" href="/logs">Logs</a>
        <button class="link" id="logout" type="button">Sign out</button>
      </nav>
    </header>
    <p class="error" id="status" role="status"></p>
    <div class="grid">
      <section class="card">
        <div class="label">CPU</div>
        <div class="value" id="cpu-value">-</div>
        <div class="meter"><span id="cpu-bar"></span></div>
      </section>
      <section class="card">
        <div class="label">Memory</div>
        <div class="value" id="mem-value">-</div>
        <div class="meter"><span id="mem-bar"></span></div>
        <div class="detail" id="mem-detail"></div>
      </section>
      <section class="card">
        <div class="label">Disk</div>
        <div class="value" id="disk-value">-</div>
        <div class="meter"><span id="disk-bar"></span></div>
        <div class="detail" id="disk-detail"></div>
      </section>
      <section class="card">
        <div class="label">Uptime</div>
        <div class="value" id="uptime-value">-</div>
      </section>
      <section class="card">
        <div class="label">Temperature</div>
        <div class="value" id="temp-value">-</div>
      </section>
      <section class="card" id="portal-card" hidden>
        <div class="label">Portal certificate</div>
        <div class="value" id="portal-value">-</div>
        <div class="detail" id="portal-detail"></div>
      </section>
    </div>
    <section class="card stacked">
      <div class="label">Disk health</div>
      <p class="detail" id="disks-empty">Checking...</p>
      <div id="disk-rows"></div>
    </section>
    <section class="card stacked">
      <div class="label">Machine</div>
      <p class="detail">Restarting sshd keeps existing SFTP sessions. Shutdown and reboot take the panel offline; after a shutdown you must power the machine on by hand.</p>
      <p class="error" id="power-status" role="status"></p>
      <div class="nav-row" id="power-actions">
        <button class="link" type="button" data-action="restart-sshd" data-label="Restart sshd">Restart sshd</button>
        <button class="link danger" type="button" data-action="reboot" data-label="Reboot">Reboot</button>
        <button class="link danger" type="button" data-action="shutdown" data-label="Shut down">Shut down</button>
      </div>
    </section>
  </main>
  <script src="/static/dashboard.js"></script>
</body>
</html>
