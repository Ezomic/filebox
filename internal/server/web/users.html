<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filebox users</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header class="bar">
      <h1>Users</h1>
      <nav class="actions">
        <a class="link" href="/">Dashboard</a>
        <a class="link" href="/users" aria-current="page">Users</a>
        <a class="link" href="/logs">Logs</a>
        <a class="link" id="tv-link" href="/tv" hidden>TV</a>
        <a class="link" href="/settings">Settings</a>
        <button class="link" id="logout" type="button">Sign out</button>
      </nav>
    </header>
    <p class="error" id="status" role="status"></p>
    <section class="card">
      <div class="label">SFTP users</div>
      <table id="users">
        <tbody id="user-rows"></tbody>
      </table>
      <p class="detail" id="empty" hidden>No users yet.</p>
    </section>
    <form class="card stacked" id="add-form" autocomplete="off">
      <div class="label">Add user</div>
      <label for="new-name">Username</label>
      <input type="text" id="new-name" required minlength="3" maxlength="32" pattern="[a-z][a-z0-9_\-]{2,31}" autocapitalize="none" spellcheck="false">
      <label for="new-password">Password (12 to 128 characters)</label>
      <input type="password" id="new-password" required minlength="12" maxlength="128" autocomplete="new-password">
      <p class="error" id="add-error" role="alert"></p>
      <button type="submit">Add user</button>
    </form>
    <section class="card stacked">
      <div class="label">Earlier versions (snapshots)</div>
      <p class="detail" id="snapshot-summary">Loading...</p>
      <table id="snapshots">
        <tbody id="snapshot-rows"></tbody>
      </table>
      <p class="detail" id="snapshot-held" hidden>The space shown is what only one earlier version keeps. Space that several of them share is not counted, so the real total can be higher.</p>
    </section>
  </main>
  <script src="/static/diskalert.js"></script>
  <script src="/static/users.js"></script>
  <script src="/static/snapshots.js"></script>
  <script src="/static/tvlink.js"></script>
</body>
</html>
