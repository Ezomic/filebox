name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o filebox-panel ./cmd/panel
          sha256sum filebox-panel > filebox-panel.sha256
          tar -czf deploy.tar.gz deploy
          sha256sum deploy.tar.gz > deploy.tar.gz.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" filebox-panel filebox-panel.sha256 deploy.tar.gz deploy.tar.gz.sha256 --title "$GITHUB_REF_NAME" --generate-notes
