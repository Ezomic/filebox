name: Release

on:
  push:
    tags: ['v*']
  # Creates the tag too, for when pushing a tag by hand is not possible.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, like v0.4.0 (taken from the branch this runs on)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag name
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad release tag: $TAG" >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o filebox-panel ./cmd/panel
          sha256sum filebox-panel > filebox-panel.sha256
          tar -czf deploy.tar.gz --exclude=deploy/test deploy
          sha256sum deploy.tar.gz > deploy.tar.gz.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" filebox-panel filebox-panel.sha256 deploy.tar.gz deploy.tar.gz.sha256 --title "$TAG" --target "$GITHUB_SHA" --generate-notes
