name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: fuzz (short)
        run: |
          go test ./internal/system -run '^$' -fuzz '^FuzzCleanPath$' -fuzztime 20s
          go test ./internal/system -run '^$' -fuzz '^FuzzDirFilesStaysInRoot$' -fuzztime 30s
          go test ./internal/server -run '^$' -fuzz '^FuzzPortalFilePathsStayInsideTheUser$' -fuzztime 30s
          go test ./internal/server -run '^$' -fuzz '^FuzzPortalLoginBody$' -fuzztime 20s
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
